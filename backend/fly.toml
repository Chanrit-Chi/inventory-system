# fly.toml app configuration file generated for inventory-backend-api on 2026-09-01T17:08:27+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'inventory-backend-api'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  CACHE_STORE = 'file'
  DB_CONNECTION = 'pgsql'
  DB_SSLMODE = 'require'
  LOG_CHANNEL = 'stderr'
  QUEUE_CONNECTION = 'sync'
  SESSION_DRIVER = 'cookie'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
  cpu_kind = 'shared'
